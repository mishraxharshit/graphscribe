name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: "latest" moved to 26.04, which has no Python 3.9
    strategy:
      fail-fast: false      # one failing Python version must not cancel the others
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest
      - name: Security audit of our dependencies
        run: pip-audit .   # only this project's dependencies, not the runner's own pip
